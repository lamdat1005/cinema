<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird (Slow Version)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            user-select: none; /* Chống bôi đen văn bản khi click liên tục */
        }
        canvas {
            border: 2px solid #000;
            background-color: #70c5ce;
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #instructions {
            position: absolute;
            top: 20%;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            text-align: center;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="instructions">Nhấn <b>Space</b> hoặc <b>Click</b> để chơi<br>(Bản chậm)</div>
<canvas id="gameCanvas" width="320" height="480"></canvas>

<script>
    // --- CẤU HÌNH ---
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let frames = 0;
    const DEGREE = Math.PI / 180;

    // QUẢN LÝ TRẠNG THÁI GAME
    const state = {
        current: 0,
        getReady: 0,
        game: 1,
        over: 2
    };

    // --- ĐIỀU KHIỂN ---
    function controlHandler(evt) {
        switch (state.current) {
            case state.getReady:
                state.current = state.game;
                document.getElementById("instructions").style.display = "none"; // Ẩn hướng dẫn
                break;
            case state.game:
                bird.flap();
                break;
            case state.over:
                // Reset toàn bộ game
                bird.reset();
                pipes.reset();
                score.reset();
                state.current = state.getReady;
                document.getElementById("instructions").style.display = "block"; // Hiện lại hướng dẫn
                document.getElementById("instructions").innerHTML = "Nhấn <b>Space</b> để chơi lại";
                frames = 0;
                break;
        }
    }

    document.addEventListener("click", controlHandler);
    document.addEventListener("keydown", function(evt) {
        if (evt.code === "Space") {
            controlHandler(evt);
        }
    });

    // --- ĐỐI TƯỢNG CHIM (BIRD) ---
    const bird = {
        x: 50,
        y: 150,
        w: 20,
        h: 20,
        radius: 12,
        gravity: 0.07,   // Rơi chậm hơn (cũ 0.25)
        jump: 2.3,      // Nhảy thấp hơn (cũ 4.6)
        
        speed: 0,
        rotation: 0,

        draw: function() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            
            // Vẽ thân chim
            ctx.fillStyle = "#FFD700";
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2); 
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.stroke();
            
            // Vẽ mắt
            ctx.fillStyle = "#FFF";
            ctx.beginPath();
            ctx.arc(5, -5, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#000";
            ctx.beginPath();
            ctx.arc(7, -5, 1, 0, Math.PI * 2);
            ctx.fill();
            
            // Vẽ mỏ
            ctx.fillStyle = "#f77f00";
            ctx.beginPath();
            ctx.moveTo(8, 2);
            ctx.lineTo(16, 6);
            ctx.lineTo(8, 10);
            ctx.fill();

            ctx.restore();
        },

        flap: function() {
            this.speed = -this.jump;
        },

        update: function() {
            if (state.current === state.getReady) {
                this.y = 150; 
                this.rotation = 0 * DEGREE;
            } else {
                this.speed += this.gravity;
                this.y += this.speed;

                // Va chạm nền đất
                if (this.y + this.radius >= canvas.height - fg.h) {
                    this.y = canvas.height - fg.h - this.radius;
                    if (state.current === state.game) {
                        state.current = state.over;
                    }
                }

                // Xoay đầu chim
                if (this.speed < this.jump) {
                    this.rotation = -25 * DEGREE;
                } else {
                    this.rotation = 90 * DEGREE;
                    if (this.rotation > 90 * DEGREE) this.rotation = 90 * DEGREE;
                }
            }
        },
        
        reset: function() {
            this.speed = 0;
            this.rotation = 0;
            this.y = 150;
        }
    };

    // --- NỀN ĐẤT (FOREGROUND) ---
    const fg = {
        h: 112,
        x: 0,
        dx: 1.5, // [ĐÃ CHỈNH SỬA] Tốc độ trôi chậm (cũ 2)
        
        draw: function() {
            ctx.fillStyle = "#ded895";
            ctx.fillRect(0, canvas.height - this.h, canvas.width, this.h);
            
            // Vẽ cỏ (hoạ tiết sọc)
            ctx.fillStyle = "#73bf2e";
            ctx.fillRect(0, canvas.height - this.h, canvas.width, 20);
            ctx.strokeStyle = "#558c22";
            ctx.beginPath();
            for(let i=0; i<canvas.width; i+=20) {
                ctx.moveTo(i + this.x % 20, canvas.height - this.h);
                ctx.lineTo(i + this.x % 20 - 10, canvas.height - this.h + 20);
            }
            ctx.stroke();
            
            // Đường viền ngăn cách
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - this.h);
            ctx.lineTo(canvas.width, canvas.height - this.h);
            ctx.stroke();
        },
        
        update: function() {
            if (state.current === state.game) {
                this.x = (this.x - this.dx) % 20; // Hiệu ứng cuộn vô tận
            }
        }
    };

    // --- ỐNG NƯỚC (PIPES) ---
    const pipes = {
        position: [],
        w: 53,
        h: 400,
        gap: 110, // Tăng khe hở lên một chút cho dễ chui (cũ 100)
        dx: 1.5,  // [ĐÃ CHỈNH SỬA] Tốc độ trôi chậm (cũ 2) - Phải bằng fg.dx
        maxYPos: -150,

        draw: function() {
            for (let i = 0; i < this.position.length; i++) {
                let p = this.position[i];
                let topY = p.y;
                let bottomY = p.y + this.h + this.gap;

                // Ống trên
                ctx.fillStyle = "#73bf2e";
                ctx.fillRect(p.x, topY, this.w, this.h);
                ctx.strokeRect(p.x, topY, this.w, this.h);
                // Miệng ống trên
                ctx.fillRect(p.x - 2, topY + this.h - 20, this.w + 4, 20);
                ctx.strokeRect(p.x - 2, topY + this.h - 20, this.w + 4, 20);

                // Ống dưới
                ctx.fillStyle = "#73bf2e";
                ctx.fillRect(p.x, bottomY, this.w, this.h);
                ctx.strokeRect(p.x, bottomY, this.w, this.h);
                // Miệng ống dưới
                ctx.fillRect(p.x - 2, bottomY, this.w + 4, 20);
                ctx.strokeRect(p.x - 2, bottomY, this.w + 4, 20);
            }
        },

        update: function() {
            if (state.current !== state.game) return;

            // Thêm ống mới (khoảng cách xuất hiện thưa hơn chút vì game chạy chậm)
            if (frames % 120 === 0) { 
                this.position.push({
                    x: canvas.width,
                    y: this.maxYPos * (Math.random() + 1)
                });
            }

            for (let i = 0; i < this.position.length; i++) {
                let p = this.position[i];
                let bottomPipeY = p.y + this.h + this.gap;

                // Di chuyển ống
                p.x -= this.dx;

                // Xử lý va chạm
                // 1. Chim nằm trong vùng ngang của ống
                if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + this.w) {
                    // 2. Chim chạm ống trên HOẶC chạm ống dưới
                    if (bird.y - bird.radius < p.y + this.h || bird.y + bird.radius > bottomPipeY) {
                        state.current = state.over;
                    }
                }

                // Xóa ống + Tính điểm
                if (p.x + this.w <= 0) {
                    this.position.shift();
                    score.value += 1;
                    score.best = Math.max(score.value, score.best);
                    localStorage.setItem("flappy_best_slow", score.best);
                }
            }
        },
        
        reset: function() {
            this.position = [];
        }
    };

    // --- ĐIỂM SỐ (SCORE) ---
    const score = {
        best: localStorage.getItem("flappy_best_slow") || 0,
        value: 0,
        
        draw: function() {
            ctx.fillStyle = "#FFF";
            ctx.strokeStyle = "#000";
            
            if (state.current === state.game) {
                ctx.lineWidth = 2;
                ctx.font = "35px Arial";
                ctx.fillText(this.value, canvas.width / 2, 50);
                ctx.strokeText(this.value, canvas.width / 2, 50);
            } else if (state.current === state.over) {
                // Bảng điểm Game Over
                ctx.fillStyle = "#e0c060";
                ctx.fillRect(canvas.width/2 - 90, 160, 180, 120);
                ctx.strokeRect(canvas.width/2 - 90, 160, 180, 120);

                ctx.fillStyle = "#FFF";
                ctx.font = "25px Arial";
                ctx.fillText("Score: " + this.value, canvas.width / 2 - 40, 210);
                ctx.fillText("Best: " + this.best, canvas.width / 2 - 40, 250);
                
                ctx.font = "40px Arial";
                ctx.strokeStyle = "#FFF"; 
                ctx.lineWidth = 1;
                ctx.fillStyle = "#e86101";
                ctx.fillText("GAME OVER", canvas.width / 2 - 110, 120);
                ctx.strokeText("GAME OVER", canvas.width / 2 - 110, 120);
            }
        },
        
        reset: function() {
            this.value = 0;
        }
    };

    // --- GAME LOOP ---
    function draw() {
        ctx.fillStyle = "#70c5ce";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Vẽ mây (trang trí)
        ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
        ctx.beginPath();
        ctx.arc(100, 300, 30, 0, Math.PI * 2);
        ctx.arc(140, 300, 40, 0, Math.PI * 2);
        ctx.arc(180, 300, 30, 0, Math.PI * 2);
        ctx.fill();

        pipes.draw();
        fg.draw();
        bird.draw();
        score.draw();
    }

    function update() {
        bird.update();
        fg.update();
        pipes.update();
    }

    function loop() {
        update();
        draw();
        frames++;
        requestAnimationFrame(loop);
    }

    loop();

</script>
</body>
</html>
